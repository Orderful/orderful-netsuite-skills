# Dependency Review
#
# Scans PRs for new dependencies with known vulnerabilities or disallowed licenses (§3.2).
# Free for public repositories.

name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          # Block PRs that introduce dependencies with these licenses (§3.2)
          deny-licenses: GPL-2.0-only, GPL-3.0-only, AGPL-3.0-only, SSPL-1.0, BUSL-1.1
          # Fail on vulnerabilities rated high or critical
          fail-on-severity: high
          comment-summary-in-pr: always
